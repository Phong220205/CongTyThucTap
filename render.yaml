services:
  # ============================================================
  # HDHOME Postgres (free 90 days)
  # ============================================================
  - type: pserv
    name: hdhome-db
    plan: free
    region: singapore
    ipAllowList: []  # only accessible from Render services in same region
    postgresMajorVersion: "16"
    databaseName: hdhome_management
    databaseUser: hdhome_user

  # ============================================================
  # HDHOME Backend - Node.js + Express + Postgres
  # ============================================================
  - type: web
    name: hdhome-backend
    runtime: docker
    rootDir: hdhome-project/backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_IMPORT_DB
        value: "true"
      # Database connection - injected by Render from linked Postgres service
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: hdhome-db
          property: connectionString
      # FRONTEND_URL auto-set after frontend deploys - update manually
      - key: FRONTEND_URL
        value: https://hdhome-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: PORT
        value: "5000"

  # ============================================================
  # HDHOME Frontend - React + Vite (Static SPA)
  # ============================================================
  - type: web
    name: hdhome-frontend
    runtime: docker
    rootDir: hdhome-project/frontend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      # VITE_API_URL auto-set after backend deploys - update manually
      - key: VITE_API_URL
        value: https://hdhome-backend.onrender.com/api
