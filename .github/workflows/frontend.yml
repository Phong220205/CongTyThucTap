name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'hdhome-project/frontend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'hdhome-project/frontend/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hdhome-project/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hdhome-project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Summary
        run: |
          echo "✅ Frontend CI passed!"
          echo "📝 NOTE: Create frontend service on Render first, then add RENDER_FRONTEND_SERVICE_ID to GitHub Variables"