services:
  # MariaDB Database
  database:
    image: mariadb:11
    container_name: hdhome-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hdhome_root_2026}
      MYSQL_DATABASE: ${DB_NAME:-hdhome_management}
      MYSQL_USER: ${DB_USER:-hdhome}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hdhome_prod_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - hdhome-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hdhome-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER:-hdhome}
      DB_PASSWORD: ${DB_PASSWORD:-hdhome_prod_pass}
      DB_NAME: ${DB_NAME:-hdhome_management}
      DB_CONNECTION_LIMIT: 10
      JWT_SECRET: ${JWT_SECRET:-hdhome_jwt_secret_change_in_production_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - hdhome-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hdhome-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - hdhome-network

volumes:
  db_data:
  uploads_data:

networks:
  hdhome-network:
    driver: bridge
